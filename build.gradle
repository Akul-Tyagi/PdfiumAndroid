plugins {
    id 'com.android.library' version '8.12.0'
    id 'org.jetbrains.kotlin.android' version '1.9.24'   // Remove if you decide to stay Java-only
    id 'maven-publish'
}

group = "com.github.Akul-Tyagi"
version = "1.11.0-16kb"

android {
    namespace "com.shockwave.pdfium"
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
        versionCode 7
        versionName version
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""
        // If you want to explicitly restrict ABIs (optional):
        // ndk { abiFilters += ["armeabi-v7a","arm64-v8a","x86","x86_64"] }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
        debug { }
    }

    // Use ndk-build (Android.mk / Application.mk)
    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
            // For troubleshooting link commands temporarily add:
            // arguments "V=1"
        }
    }

    ndkVersion "27.3.13750724"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig = true
    }

    // Tell AGP we want to publish release variant with sources
    publishing {
        singleVariant("release") {
            withSourcesJar()
            // If you later add javadoc tasks you can also attach Javadoc jar here.
        }
    }
}

// Publication (wait until after Android has registered components)
afterEvaluate {
    publishing {
        publications {
            // Use the conventional 'release' publication name
            create("release", MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = "pdfium-android"
                version = project.version
                pom {
                    name = "PdfiumAndroid"
                    description = "Pdfium Android binding (modernized, 16KB page size compliant)"
                    url = "https://github.com/Akul-Tyagi/PdfiumAndroid"
                    licenses {
                        license {
                            name = "Apache License 2.0"
                            url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                        }
                    }
                    scm {
                        url = "https://github.com/Akul-Tyagi/PdfiumAndroid"
                        connection = "scm:git:https://github.com/Akul-Tyagi/PdfiumAndroid.git"
                        developerConnection = "scm:git:ssh:git@github.com:Akul-Tyagi/PdfiumAndroid.git"
                    }
                    developers {
                        developer {
                            id = "akul"
                            name = "Akul Tyagi"
                        }
                    }
                }
            }
        }
    }
}

dependencies {
    // No external runtime dependencies presently
}